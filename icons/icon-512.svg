<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="400" cy="106" r="150" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>

  <!-- مثلث -->
  <polygon points="256,100 100,382 412,382"
           fill="none" stroke="#ffffff" stroke-width="24"
           stroke-linejoin="round" stroke-linecap="round"/>

  <!-- دایره‌ی مساحت -->
  <circle cx="256" cy="288" r="50" fill="#fbbf24"/>
  <circle cx="256" cy="288" r="50" fill="none" stroke="#ffffff" stroke-width="8"/>

  <!-- خط کسری -->
  <line x1="192" y1="436" x2="320" y2="436"
        stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>