<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- پس‌زمینه با گوشه‌های گرد -->
  <rect width="192" height="192" rx="42" fill="url(#bg)"/>

  <!-- درخشش ملایم بالا-راست -->
  <circle cx="150" cy="40" r="55" fill="#ffffff" opacity="0.10" filter="url(#soft)"/>

  <!-- مثلث سفید -->
  <polygon points="96,38 38,142 154,142"
           fill="none" stroke="#ffffff" stroke-width="9"
           stroke-linejoin="round" stroke-linecap="round"/>

  <!-- دایره‌ی زرد (مفهوم مساحت) -->
  <circle cx="96" cy="108" r="19" fill="#fbbf24"/>
  <circle cx="96" cy="108" r="19" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- خط کسری زیر -->
  <line x1="72" y1="163" x2="120" y2="163"
        stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
</svg>