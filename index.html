<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ریاضی‌یار | بازی آموزشی ریاضی</title>
  <meta name="description" content="بازی آموزشی محیط، مساحت و کسرها برای پایه‌های ۴ تا ۹">

  <!-- ============ PWA ============ -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="color-scheme" content="light">

  <!-- iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ریاضی‌یار">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.svg">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">

  <!-- ============ فونت وزیرمتن ============ -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app" role="main"></div>

  <!-- دکمه نصب PWA -->
  <button id="installBtn" aria-label="نصب اپلیکیشن" style="
    display: none; position: fixed; bottom: 100px; left: 50%;
    transform: translateX(-50%); z-index: 500;
    background: linear-gradient(135deg, #7c3aed, #06b6d4);
    color: #fff; padding: 12px 24px; border-radius: 999px;
    font-family: Vazirmatn, Tahoma, sans-serif; font-weight: 700;
    font-size: 1rem; border: none; cursor: pointer;
    box-shadow: 0 8px 24px rgba(124,58,237,.4);
  ">📲 نصب ریاضی‌یار</button>

  <!-- نشانگر وضعیت -->
  <div id="offlineToast" role="status" aria-live="polite" style="
    display: none; position: fixed; top: 20px; left: 50%;
    transform: translateX(-50%); z-index: 600;
    background: #10b981; color: #fff;
    padding: 10px 20px; border-radius: 999px;
    font-family: Vazirmatn, Tahoma, sans-serif; font-size: .9rem;
    box-shadow: 0 6px 18px rgba(16,185,129,.4);
  "></div>

  <script src="script.js"></script>

  <!-- ============ منطق PWA ============ -->
  <script>
  (function () {
    'use strict';

    // ---------- ثبت Service Worker ----------
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' })
          .then(() => {
            // اگر قبلاً یک SW فعال داشته‌ایم، همین حالا آفلاین آماده است
            if (navigator.serviceWorker.controller) {
              showToast('✅ آماده‌ی استفاده‌ی آفلاین');
            }
          })
          .catch(err => console.warn('SW ثبت نشد:', err));

        // وقتی SW جدید کنترل را به دست گرفت
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          showToast('✅ ریاضی‌یار بروزرسانی شد');
        });
      });
    }

    function showToast(msg) {
      const t = document.getElementById('offlineToast');
      if (!t) return;
      t.textContent = msg;
      t.style.display = 'block';
      clearTimeout(t._timer);
      t._timer = setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    // ---------- دکمه‌ی نصب PWA ----------
    let deferredPrompt = null;
    const installBtn = document.getElementById('installBtn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = 'block';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        installBtn.style.display = 'none';
        deferredPrompt.prompt();
        try { await deferredPrompt.userChoice; } catch (e) {}
        deferredPrompt = null;
      });
    }

    window.addEventListener('appinstalled', () => {
      if (installBtn) installBtn.style.display = 'none';
      showToast('🎉 ریاضی‌یار نصب شد!');
    });

    // ---------- تشخیص حالت آفلاین ----------
    window.addEventListener('offline', () => {
      showToast('📴 حالت آفلاین — همه‌چیز کار می‌کند');
    });
  })();
  </script>
</body>
</html>
